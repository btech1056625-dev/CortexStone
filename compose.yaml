services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortexstone}
      POSTGRES_USER: ${POSTGRES_USER:-cortexstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cortexstone}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cortexstone}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      NEBIUS_ROUTER_MODEL_ID: ${NEBIUS_ROUTER_MODEL_ID:-nvidia/nemotron-mini-4b-instruct}
      NEBIUS_REASONER_MODEL_ID: ${NEBIUS_REASONER_MODEL_ID:-nvidia/nemotron-3-super-120b-a12b}
      CORTEXSTONE_AUTH_ISSUER: ${CORTEXSTONE_AUTH_ISSUER:-}
      CORTEXSTONE_AUTH_AUDIENCE: ${CORTEXSTONE_AUTH_AUDIENCE:-}
      CORTEXSTONE_AUTH_JWKS_URL: ${CORTEXSTONE_AUTH_JWKS_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
